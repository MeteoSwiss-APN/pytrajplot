default:
  - build:
      - checkGivenSemanticVersion:
          checkSemanticVersion:
      - getSemanticVersion:
          gitCalculateSemanticVersion:
      - getImageName:
          containerConstructImageName:
      - artifacts:
          - containerBuildImage:
              imageName: ${var.containerImageName}-tester
              imageTag: ${var.semanticVersion}
              target: tester
              extraArgs:
                - --build-arg
                - VERSION=${var.semanticVersion}
          - containerBuildImage:
              imageName: ${var.containerImageName}
              imageTag: ${var.semanticVersion}
              target: runner
              extraArgs:
                - --build-arg
                - VERSION=${var.semanticVersion}
              pullAlways: false
  - verify:
      - format:
          - pythonContainerRun:
              imageName: ${var.containerImageName}-tester
              imageTag: ${var.semanticVersion}
              pullAlways: false
              packageManager: ''
              removeLocalImage: false
              commands: ruff format --check || { echo "Format check failed. Run 'ruff format' to fix."; exit 1; }
  - test:
      - unit:
          - pythonContainerTest:
              imageName: ${var.containerImageName}-tester
              imageTag: ${var.semanticVersion}
              pullAlways: false
              packageManager: ''
              removeLocalImage: false
      - lint:
          - pythonContainerLint:
              imageName: ${var.containerImageName}-tester
              imageTag: ${var.semanticVersion}
              pullAlways: false
              packageManager: ''
              removeLocalImage: false
          - pythonContainerTypeCheck:
              imageName: ${var.containerImageName}-tester
              imageTag: ${var.semanticVersion}
              pullAlways: false
              packageManager: ''
              removeLocalImage: false
  - publish:
      - artifacts:
          - containerPublishImage:
              imageName: ${var.containerImageName}
              imageTag: ${var.semanticVersion}
  - clean:
      - images:
          cleanupImages:
            targets:
              - label://ch.meteoswiss.project=${var.project}-${var.semanticVersion}

# Alternative setup for installing and testing the service locally using the system's Python environment.
local:
  - build:
      - install:
          - pythonLocalInstall:
      - docs:
          - pythonLocalDocs:
      - format:
          - pythonLocalRun:
              commands: ruff format
  - test:
      - unit:
          - pythonLocalTest:
      - lint:
          - pythonLocalLint:
          - pythonLocalTypeCheck:
  - run:
      - main:
          - pythonLocalRun:
              commands: pytrajplot --help

variables:
  solution: dispersionmodelling
  project: pytrajplot
  notifyOnNightlyFailure: p_dispersionmodelling@meteoswiss.ch
  semanticVersion: 0.0.0  # is overwritten in Jenkins
  containerImageName: docker-intern-nexus.meteoswiss.ch/dispersionmodelling/pytrajplot
